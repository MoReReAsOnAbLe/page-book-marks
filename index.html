<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bookmarks</title>
<style>
  :root {
    --bg: #f4f6fb;
    --bg-grad-1: #eef2fb;
    --bg-grad-2: #f7f3fb;
    --card: #ffffff;
    --card-hover: #ffffff;
    --text: #1b2030;
    --text-soft: #5b647a;
    --text-faint: #99a0b3;
    --border: #e6e9f2;
    --border-strong: #d6dbe8;
    --accent: #5b6cff;
    --accent-soft: #eef0ff;
    --danger: #e5484d;
    --shadow: 0 1px 2px rgba(20,26,50,.04), 0 8px 24px rgba(20,26,50,.06);
    --shadow-hover: 0 4px 10px rgba(20,26,50,.08), 0 18px 40px rgba(20,26,50,.12);
    --radius: 16px;
  }
  html[data-theme="dark"] {
    --bg: #0f1117;
    --bg-grad-1: #11131c;
    --bg-grad-2: #161320;
    --card: #1a1d27;
    --card-hover: #1f2330;
    --text: #eef0f6;
    --text-soft: #aab0c2;
    --text-faint: #6b7286;
    --border: #272b38;
    --border-strong: #333848;
    --accent: #7c8bff;
    --accent-soft: #232844;
    --danger: #ff6166;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --shadow-hover: 0 4px 10px rgba(0,0,0,.4), 0 18px 40px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 600px at 10% -10%, var(--bg-grad-1), transparent 60%),
      radial-gradient(1000px 500px at 110% 0%, var(--bg-grad-2), transparent 55%),
      var(--bg);
    min-height: 100%;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 40px 24px 80px; }

  header.top {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 28px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
  .brand .logo {
    width: 38px; height: 38px; border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), #9b6bff);
    display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 18px;
    box-shadow: var(--shadow);
  }
  .brand h1 { font-size: 20px; margin: 0; letter-spacing: -.2px; }
  .brand p { margin: 1px 0 0; font-size: 12.5px; color: var(--text-faint); }

  .search {
    position: relative; flex: 1 1 240px; max-width: 360px;
  }
  .search input {
    width: 100%; padding: 11px 14px 11px 38px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    font-size: 14px; outline: none; box-shadow: var(--shadow); transition: border-color .15s;
  }
  .search input:focus { border-color: var(--accent); }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-faint); }

  .btn {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    padding: 10px 14px; border-radius: 12px; font-size: 14px; font-weight: 600;
    box-shadow: var(--shadow); transition: transform .08s, border-color .15s, background .15s;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--border-strong); }
  .btn:active { transform: translateY(1px); }
  .btn.icon { padding: 10px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.05); }

  .grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); transition: box-shadow .18s, transform .12s, border-color .15s;
    position: relative; overflow: hidden;
  }
  .card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); border-color: var(--border-strong); }

  .card-main {
    display: flex; align-items: center; gap: 13px; padding: 16px 14px 16px 16px;
    cursor: pointer; text-decoration: none; color: inherit;
  }
  .favicon {
    width: 42px; height: 42px; border-radius: 11px; flex: none;
    display: grid; place-items: center; font-weight: 700; font-size: 18px; color: #fff;
    overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,.04);
  }
  .favicon img { width: 100%; height: 100%; object-fit: contain; }
  .favicon.has-img { background: #fff !important; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .favicon.has-img img { padding: 7px; }
  .card-info { min-width: 0; flex: 1; }
  .card-title { font-weight: 650; font-size: 15px; letter-spacing: -.1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-host { font-size: 12.5px; color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }

  .card-actions {
    display: flex; align-items: center; border-top: 1px solid var(--border);
  }
  .card-actions button {
    flex: 1; border: none; background: transparent; color: var(--text-soft);
    padding: 9px 8px; font-size: 12.5px; cursor: pointer; display: flex;
    align-items: center; justify-content: center; gap: 6px; transition: background .12s, color .12s;
  }
  .card-actions button:hover { background: var(--accent-soft); color: var(--accent); }
  .card-actions button + button { border-left: 1px solid var(--border); }
  .card-actions .chev svg { transition: transform .2s; }
  .card.open .card-actions .chev svg { transform: rotate(180deg); }
  .card-actions .del:hover { color: var(--danger); background: rgba(229,72,77,.08); }

  .subpanel { max-height: 0; overflow: hidden; transition: max-height .25s ease; border-top: 0 solid var(--border); background: linear-gradient(var(--card), var(--card)); }
  .card.open .subpanel { max-height: 600px; border-top: 1px solid var(--border); }
  .subpanel-inner { padding: 8px 10px 12px; }
  .sub-empty { font-size: 12.5px; color: var(--text-faint); padding: 8px 6px 12px; text-align: center; }

  .sub-item { display: flex; align-items: center; gap: 8px; padding: 8px 8px; border-radius: 10px; cursor: pointer; text-decoration: none; color: inherit; transition: background .12s; }
  .sub-item:hover { background: var(--accent-soft); }
  .sub-rank { width: 18px; text-align: center; font-size: 11px; font-weight: 700; color: var(--text-faint); flex: none; }
  .sub-name { flex: 1; min-width: 0; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub-count {
    flex: none; font-size: 11px; font-weight: 700; color: var(--accent);
    background: var(--accent-soft); padding: 2px 8px; border-radius: 20px;
  }
  .sub-del { flex: none; border: none; background: transparent; color: var(--text-faint); cursor: pointer; padding: 2px 4px; border-radius: 6px; opacity: 0; line-height: 0; }
  .sub-item:hover .sub-del { opacity: 1; }
  .sub-del:hover { color: var(--danger); }

  .sub-add {
    display: flex; gap: 6px; margin-top: 8px; padding-top: 10px; border-top: 1px dashed var(--border);
  }
  .sub-add input { flex: 1; min-width: 0; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 12.5px; outline: none; }
  .sub-add input:focus { border-color: var(--accent); }
  .sub-add button { flex: none; border: none; background: var(--accent); color: #fff; border-radius: 8px; padding: 0 12px; font-size: 13px; font-weight: 600; cursor: pointer; }

  /* add tile */
  .add-tile {
    border: 1.5px dashed var(--border-strong); border-radius: var(--radius);
    display: grid; place-items: center; min-height: 92px; cursor: pointer;
    color: var(--text-faint); font-weight: 600; font-size: 14px; gap: 6px;
    background: transparent; transition: border-color .15s, color .15s, background .15s;
  }
  .add-tile:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .add-tile .plus { width: 34px; height: 34px; border-radius: 10px; background: var(--card); display: grid; place-items: center; box-shadow: var(--shadow); }

  .empty-state { text-align: center; padding: 80px 20px; color: var(--text-faint); }
  .empty-state .big { font-size: 17px; color: var(--text-soft); margin-bottom: 6px; font-weight: 600; }

  /* modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(15,17,23,.45); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    box-shadow: var(--shadow-hover); width: 100%; max-width: 420px; padding: 22px;
    animation: pop .16s ease;
  }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal h2 { margin: 0 0 4px; font-size: 18px; }
  .modal p.hint { margin: 0 0 18px; font-size: 13px; color: var(--text-faint); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-soft); margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; padding: 11px 12px; border-radius: 11px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 14px; outline: none;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  .menu { position: relative; }
  .menu-pop {
    position: absolute; right: 0; top: calc(100% + 6px); background: var(--card);
    border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-hover);
    padding: 6px; min-width: 170px; z-index: 30; display: none;
  }
  .menu-pop.show { display: block; }
  .menu-pop button {
    width: 100%; text-align: left; border: none; background: transparent; color: var(--text);
    padding: 9px 10px; border-radius: 8px; font-size: 13.5px; cursor: pointer; display: flex; gap: 9px; align-items: center;
  }
  .menu-pop button:hover { background: var(--accent-soft); }
  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 12px;
    font-size: 13.5px; font-weight: 500; box-shadow: var(--shadow-hover); opacity: 0;
    transition: opacity .2s, transform .2s; pointer-events: none; z-index: 80;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* folders */
  .folders { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 22px; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    border: 1px solid var(--border); background: var(--card); color: var(--text-soft);
    padding: 7px 13px; border-radius: 20px; font-size: 13.5px; font-weight: 600;
    box-shadow: var(--shadow); transition: border-color .15s, background .15s, color .15s, transform .08s;
    white-space: nowrap;
  }
  .pill:hover { border-color: var(--border-strong); }
  .pill:active { transform: translateY(1px); }
  .pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pill .pill-count {
    font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 12px;
    background: var(--accent-soft); color: var(--accent);
  }
  .pill.active .pill-count { background: rgba(255,255,255,.22); color: #fff; }
  .pill.drop { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .pill.add-folder { border-style: dashed; color: var(--text-faint); }
  .pill.add-folder:hover { color: var(--accent); border-color: var(--accent); }
  .pill .pill-act {
    border: none; background: transparent; color: inherit; cursor: pointer;
    padding: 0; margin-left: 2px; line-height: 0; opacity: .8; border-radius: 5px;
  }
  .pill .pill-act:hover { opacity: 1; }

  /* drag handle + dragging */
  .grip {
    flex: none; width: 38px; display: flex; align-items: center; justify-content: center;
    cursor: grab; color: var(--text-faint); border-right: 1px solid var(--border);
    transition: background .12s, color .12s;
  }
  .grip:hover { color: var(--accent); background: var(--accent-soft); }
  .grip:active { cursor: grabbing; }
  .card.dragging { opacity: .45; outline: 2px dashed var(--accent); outline-offset: -2px; }
  .card.dragging .subpanel { max-height: 0 !important; }
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <div class="logo">B</div>
        <div>
          <h1>Bookmarks</h1>
          <p id="subtitle">Your shortcuts, ranked by how you use them</p>
        </div>
      </div>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="searchInput" type="text" placeholder="Search bookmarks…" autocomplete="off" />
      </div>
      <div class="menu">
        <button class="btn icon" id="moreBtn" title="More">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button>
        <div class="menu-pop" id="morePop">
          <button id="themeBtn">🌗 Toggle theme</button>
          <button id="exportBtn">⬇️ Export backup</button>
          <button id="importBtn">⬆️ Import backup</button>
        </div>
      </div>
      <button class="btn primary" id="addBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Add bookmark
      </button>
    </header>

    <div id="folders" class="folders"></div>
    <div id="grid" class="grid"></div>
    <input type="file" id="importFile" accept="application/json" hidden />
  </div>

  <!-- bookmark modal -->
  <div class="overlay" id="bmOverlay">
    <div class="modal">
      <h2 id="bmTitle">Add bookmark</h2>
      <p class="hint">Give it a name and the website address.</p>
      <div class="field">
        <label for="bmName">Name</label>
        <input id="bmName" type="text" placeholder="e.g. Anthropic" />
      </div>
      <div class="field">
        <label for="bmUrl">Website URL</label>
        <input id="bmUrl" type="text" placeholder="e.g. anthropic.com" />
      </div>
      <div class="field">
        <label for="bmFolder">Folder</label>
        <select id="bmFolder"></select>
      </div>
      <div class="modal-actions">
        <button class="btn" id="bmCancel">Cancel</button>
        <button class="btn primary" id="bmSave">Save</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";
  const KEY = "pbm.data.v2";
  const KEY_V1 = "pbm.bookmarks.v1";
  const THEME_KEY = "pbm.theme";
  const ALL = "all";

  // ---------- state ----------
  let folders = [];
  let bookmarks = [];
  let activeFolder = ALL;
  let editingId = null;
  let query = "";
  let draggingId = null;

  (function loadState() {
    // v2 native format
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const d = JSON.parse(raw);
        folders = Array.isArray(d.folders) ? d.folders : [];
        bookmarks = Array.isArray(d.bookmarks) ? d.bookmarks : [];
        return;
      }
    } catch (e) {}
    // migrate v1 (a bare array of bookmarks) -> v2
    try {
      const raw1 = localStorage.getItem(KEY_V1);
      if (raw1) {
        const arr = JSON.parse(raw1);
        if (Array.isArray(arr)) {
          folders = [];
          bookmarks = arr.map(b => Object.assign({ folderId: null }, b));
          save();
          return;
        }
      }
    } catch (e) {}
    // fresh install
    folders = [];
    bookmarks = seed();
    save();
  })();

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ folders, bookmarks })); } catch (e) {}
  }
  function seed() {
    return [
      { id: uid(), title: "Anthropic", url: "https://www.anthropic.com", visits: 0, subpages: [], folderId: null },
      { id: uid(), title: "GitHub", url: "https://github.com", visits: 0, subpages: [], folderId: null },
      { id: uid(), title: "YouTube", url: "https://youtube.com", visits: 0, subpages: [], folderId: null },
    ];
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function folderName(id) { const f = folders.find(x => x.id === id); return f ? f.name : null; }

  // ---------- url helpers ----------
  function normalizeUrl(u) {
    u = (u || "").trim();
    if (!u) return "";
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    return u;
  }
  function hostOf(u) {
    try { return new URL(normalizeUrl(u)).hostname.replace(/^www\./, ""); }
    catch (e) { return u; }
  }
  function faviconSources(u) {
    const h = hostOf(u);
    return [
      "https://www.google.com/s2/favicons?sz=128&domain=" + encodeURIComponent(h),
      "https://icons.duckduckgo.com/ip3/" + encodeURIComponent(h) + ".ico",
      "https://" + h + "/favicon.ico"
    ];
  }
  const COLORS = ["#5b6cff","#ff6b6b","#23a6d5","#22b07d","#f4a52b","#9b6bff","#e0518a","#0fb5ba","#7a8aff","#ff8a3d"];
  function colorFor(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return COLORS[h % COLORS.length];
  }

  // ---------- rendering ----------
  const grid = document.getElementById("grid");
  const foldersEl = document.getElementById("folders");

  function inFolder(b) { return activeFolder === ALL || b.folderId === activeFolder; }

  function renderFolders() {
    foldersEl.innerHTML = "";

    const pill = (label, count, id, active) => {
      const el = document.createElement("button");
      el.className = "pill" + (active ? " active" : "");
      el.innerHTML = '<span class="pill-label"></span>';
      el.querySelector(".pill-label").textContent = label;
      const c = document.createElement("span");
      c.className = "pill-count";
      c.textContent = count;
      el.appendChild(c);
      el.onclick = () => { activeFolder = id; renderFolders(); render(); };
      // drop target: move dragged bookmark into this folder
      el.addEventListener("dragover", e => { if (draggingId) { e.preventDefault(); el.classList.add("drop"); } });
      el.addEventListener("dragleave", () => el.classList.remove("drop"));
      el.addEventListener("drop", e => {
        e.preventDefault(); el.classList.remove("drop");
        const b = bookmarks.find(x => x.id === draggingId);
        if (b) { b.folderId = (id === ALL ? null : id); save(); toast(id === ALL ? "Moved out of folder" : "Moved to " + label); }
        render();
      });
      return el;
    };

    foldersEl.appendChild(pill("All", bookmarks.length, ALL, activeFolder === ALL));

    folders.forEach(f => {
      const count = bookmarks.filter(b => b.folderId === f.id).length;
      const p = pill(f.name, count, f.id, activeFolder === f.id);
      if (activeFolder === f.id) {
        const ren = document.createElement("button");
        ren.className = "pill-act"; ren.title = "Rename folder";
        ren.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
        ren.onclick = (e) => { e.stopPropagation(); renameFolder(f.id); };
        const del = document.createElement("button");
        del.className = "pill-act"; del.title = "Delete folder";
        del.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
        del.onclick = (e) => { e.stopPropagation(); deleteFolder(f.id); };
        p.appendChild(ren); p.appendChild(del);
      }
      foldersEl.appendChild(p);
    });

    const add = document.createElement("button");
    add.className = "pill add-folder";
    add.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> New folder';
    add.onclick = addFolder;
    foldersEl.appendChild(add);
  }

  function render() {
    renderFolders();
    grid.innerHTML = "";
    const q = query.toLowerCase();
    const list = bookmarks.filter(b => inFolder(b) &&
      (!q || (b.title || "").toLowerCase().includes(q) || hostOf(b.url).includes(q)));

    if (list.length === 0) {
      const msg = query
        ? '<div class="big">No matches</div>Nothing matches “' + escapeHtml(query) + '”.'
        : (activeFolder === ALL
            ? '<div class="big">No bookmarks yet</div>Click “Add bookmark” to create your first one.'
            : '<div class="big">This folder is empty</div>Drag a bookmark onto it, or add one here.');
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1">' + msg + '</div>';
    } else {
      list.forEach(b => grid.appendChild(cardEl(b)));
    }

    const add = document.createElement("div");
    add.className = "add-tile";
    add.innerHTML = '<div class="plus"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>Add bookmark';
    add.onclick = () => openBookmarkModal(null);
    grid.appendChild(add);
  }

  // ---------- drag to reorder ----------
  grid.addEventListener("dragover", e => {
    if (!draggingId) return;
    const dragging = grid.querySelector(".card.dragging");
    if (!dragging) return;
    e.preventDefault();
    const target = e.target.closest(".card");
    if (!target || target === dragging || !target.dataset.id) return;
    const rect = target.getBoundingClientRect();
    const after = e.clientY > rect.bottom ? true
                : e.clientY < rect.top ? false
                : e.clientX > rect.left + rect.width / 2;
    if (after) target.after(dragging); else target.before(dragging);
  });

  function commitOrderFromDOM() {
    const ids = [...grid.querySelectorAll(".card[data-id]")].map(c => c.dataset.id);
    if (!ids.length) return;
    const idSet = new Set(ids);
    const ordered = ids.map(id => bookmarks.find(b => b.id === id)).filter(Boolean);
    let k = 0;
    bookmarks = bookmarks.map(b => idSet.has(b.id) ? ordered[k++] : b);
  }

  function cardEl(b) {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.id = b.id;

    // main clickable area
    const main = document.createElement("a");
    main.className = "card-main";
    main.href = normalizeUrl(b.url);
    main.target = "_blank";
    main.rel = "noopener";
    main.onclick = () => { b.visits = (b.visits || 0) + 1; save(); };

    const fav = document.createElement("div");
    fav.className = "favicon";
    fav.style.background = colorFor(b.title || b.url);
    const letter = (b.title || hostOf(b.url) || "?").trim().charAt(0).toUpperCase();
    fav.textContent = letter;
    const img = document.createElement("img");
    img.alt = "";
    img.referrerPolicy = "no-referrer";
    const sources = faviconSources(b.url);
    let si = 0;
    img.onload = () => {
      // some providers return a blank/zero-size image on "success" — treat that as a miss
      if (img.naturalWidth > 0) { fav.textContent = ""; fav.classList.add("has-img"); }
      else img.onerror();
    };
    img.onerror = () => {
      si += 1;
      if (si < sources.length) img.src = sources[si];
      else { img.remove(); fav.classList.remove("has-img"); } // keep the letter tile
    };
    img.src = sources[0];
    fav.appendChild(img);

    const info = document.createElement("div");
    info.className = "card-info";
    info.innerHTML = '<div class="card-title"></div><div class="card-host"></div>';
    info.querySelector(".card-title").textContent = b.title || hostOf(b.url);
    info.querySelector(".card-host").textContent = hostOf(b.url);

    main.appendChild(fav);
    main.appendChild(info);
    card.appendChild(main);

    // action bar
    const actions = document.createElement("div");
    actions.className = "card-actions";

    const grip = document.createElement("div");
    grip.className = "grip";
    grip.draggable = true;
    grip.title = "Drag to reorder";
    grip.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';
    grip.addEventListener("dragstart", (e) => {
      draggingId = b.id;
      card.classList.add("dragging");
      card.classList.remove("open");
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", b.id); } catch (err) {}
    });
    grip.addEventListener("dragend", () => {
      const moved = draggingId;
      draggingId = null;
      card.classList.remove("dragging");
      foldersEl.querySelectorAll(".pill.drop").forEach(p => p.classList.remove("drop"));
      // if the card is still in the grid (reordered, not moved to another folder), persist order
      if (moved && grid.querySelector('.card[data-id="' + moved + '"]')) {
        commitOrderFromDOM();
        save();
      }
    });
    actions.appendChild(grip);

    const subCount = (b.subpages || []).length;
    const chev = document.createElement("button");
    chev.className = "chev";
    chev.innerHTML = (subCount ? subCount + " pages " : "Pages ") +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>';
    chev.onclick = (e) => { e.stopPropagation(); card.classList.toggle("open"); };

    const editB = document.createElement("button");
    editB.title = "Edit";
    editB.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
    editB.onclick = (e) => { e.stopPropagation(); openBookmarkModal(b.id); };

    const delB = document.createElement("button");
    delB.className = "del";
    delB.title = "Delete";
    delB.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';
    delB.onclick = (e) => { e.stopPropagation(); deleteBookmark(b.id); };

    actions.appendChild(chev);
    actions.appendChild(editB);
    actions.appendChild(delB);
    card.appendChild(actions);

    // subpanel
    card.appendChild(subPanelEl(b));
    return card;
  }

  function subPanelEl(b) {
    const panel = document.createElement("div");
    panel.className = "subpanel";
    const inner = document.createElement("div");
    inner.className = "subpanel-inner";

    const subs = (b.subpages || []).slice().sort((a, c) => (c.visits || 0) - (a.visits || 0));

    if (subs.length === 0) {
      const e = document.createElement("div");
      e.className = "sub-empty";
      e.textContent = "No pages yet. Add the pages you visit most — they’ll rank by your clicks.";
      inner.appendChild(e);
    } else {
      subs.forEach((s, i) => {
        const item = document.createElement("a");
        item.className = "sub-item";
        item.href = normalizeUrl(s.url);
        item.target = "_blank";
        item.rel = "noopener";
        item.onclick = () => { s.visits = (s.visits || 0) + 1; save(); render(); reopen(b.id); };

        const rank = document.createElement("div");
        rank.className = "sub-rank";
        rank.textContent = (i + 1);

        const name = document.createElement("div");
        name.className = "sub-name";
        name.textContent = s.title || hostOf(s.url);

        const count = document.createElement("div");
        count.className = "sub-count";
        count.textContent = (s.visits || 0) + (s.visits === 1 ? " visit" : " visits");

        const del = document.createElement("button");
        del.className = "sub-del";
        del.title = "Remove page";
        del.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
        del.onclick = (e) => {
          e.preventDefault(); e.stopPropagation();
          b.subpages = b.subpages.filter(x => x.id !== s.id);
          save(); render(); reopen(b.id);
        };

        item.appendChild(rank);
        item.appendChild(name);
        item.appendChild(count);
        item.appendChild(del);
        inner.appendChild(item);
      });
    }

    // add sub-page form
    const form = document.createElement("form");
    form.className = "sub-add";
    form.innerHTML =
      '<input class="sp-name" type="text" placeholder="Page name" />' +
      '<input class="sp-url" type="text" placeholder="URL" />' +
      '<button type="submit">Add</button>';
    form.onsubmit = (e) => {
      e.preventDefault();
      const nameI = form.querySelector(".sp-name");
      const urlI = form.querySelector(".sp-url");
      const t = nameI.value.trim();
      const u = urlI.value.trim();
      if (!u) { urlI.focus(); return; }
      b.subpages = b.subpages || [];
      b.subpages.push({ id: uid(), title: t || hostOf(u), url: normalizeUrl(u), visits: 0 });
      save(); render(); reopen(b.id);
    };
    inner.appendChild(form);

    panel.appendChild(inner);
    return panel;
  }

  // keep a card open across re-render
  function reopen(id) {
    const c = grid.querySelector('.card[data-id="' + id + '"]');
    if (c) c.classList.add("open");
  }

  function escapeHtml(s) { return (s || "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

  // ---------- bookmark CRUD ----------
  function deleteBookmark(id) {
    const b = bookmarks.find(x => x.id === id);
    if (!b) return;
    if (!confirm('Delete “' + (b.title || hostOf(b.url)) + '”? This also removes its tracked pages.')) return;
    bookmarks = bookmarks.filter(x => x.id !== id);
    save(); render(); toast("Bookmark deleted");
  }

  // ---------- bookmark modal ----------
  const bmOverlay = document.getElementById("bmOverlay");
  const bmName = document.getElementById("bmName");
  const bmUrl = document.getElementById("bmUrl");
  const bmTitle = document.getElementById("bmTitle");
  const bmFolder = document.getElementById("bmFolder");

  function populateFolderSelect(selected) {
    bmFolder.innerHTML = '<option value="">No folder</option>';
    folders.forEach(f => {
      const o = document.createElement("option");
      o.value = f.id; o.textContent = f.name;
      if (f.id === selected) o.selected = true;
      bmFolder.appendChild(o);
    });
  }

  function openBookmarkModal(id) {
    editingId = id;
    const b = id ? bookmarks.find(x => x.id === id) : null;
    bmTitle.textContent = b ? "Edit bookmark" : "Add bookmark";
    bmName.value = b ? b.title : "";
    bmUrl.value = b ? b.url : "";
    const preset = b ? (b.folderId || "") : (activeFolder === ALL ? "" : activeFolder);
    populateFolderSelect(preset);
    bmOverlay.classList.add("show");
    setTimeout(() => bmName.focus(), 30);
  }
  function closeBookmarkModal() { bmOverlay.classList.remove("show"); editingId = null; }

  function saveBookmark() {
    const t = bmName.value.trim();
    const u = bmUrl.value.trim();
    if (!u) { bmUrl.focus(); return; }
    const folderId = bmFolder.value || null;
    if (editingId) {
      const b = bookmarks.find(x => x.id === editingId);
      if (b) { b.title = t || hostOf(u); b.url = normalizeUrl(u); b.folderId = folderId; }
      toast("Bookmark updated");
    } else {
      bookmarks.push({ id: uid(), title: t || hostOf(u), url: normalizeUrl(u), visits: 0, subpages: [], folderId: folderId });
      toast("Bookmark added");
    }
    save(); render(); closeBookmarkModal();
  }

  // ---------- folder CRUD ----------
  function addFolder() {
    const name = (prompt("New folder name:") || "").trim();
    if (!name) return;
    const f = { id: uid(), name };
    folders.push(f);
    activeFolder = f.id;
    save(); render();
  }
  function renameFolder(id) {
    const f = folders.find(x => x.id === id);
    if (!f) return;
    const name = (prompt("Rename folder:", f.name) || "").trim();
    if (!name) return;
    f.name = name; save(); render();
  }
  function deleteFolder(id) {
    const f = folders.find(x => x.id === id);
    if (!f) return;
    const n = bookmarks.filter(b => b.folderId === id).length;
    const msg = n ? 'Delete folder “' + f.name + '”? Its ' + n + ' bookmark' + (n === 1 ? "" : "s") + ' will move to “No folder” (they are not deleted).'
                  : 'Delete folder “' + f.name + '”?';
    if (!confirm(msg)) return;
    bookmarks.forEach(b => { if (b.folderId === id) b.folderId = null; });
    folders = folders.filter(x => x.id !== id);
    if (activeFolder === id) activeFolder = ALL;
    save(); render(); toast("Folder deleted");
  }

  document.getElementById("bmSave").onclick = saveBookmark;
  document.getElementById("bmCancel").onclick = closeBookmarkModal;
  bmOverlay.onclick = (e) => { if (e.target === bmOverlay) closeBookmarkModal(); };
  bmUrl.addEventListener("keydown", e => { if (e.key === "Enter") saveBookmark(); });
  bmName.addEventListener("keydown", e => { if (e.key === "Enter") bmUrl.focus(); });

  document.getElementById("addBtn").onclick = () => openBookmarkModal(null);

  // ---------- search ----------
  document.getElementById("searchInput").addEventListener("input", e => {
    query = e.target.value; render();
  });

  // ---------- overflow menu ----------
  const morePop = document.getElementById("morePop");
  document.getElementById("moreBtn").onclick = (e) => { e.stopPropagation(); morePop.classList.toggle("show"); };
  document.addEventListener("click", () => morePop.classList.remove("show"));
  morePop.onclick = (e) => e.stopPropagation();

  // ---------- theme ----------
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  }
  (function initTheme() {
    let t = null;
    try { t = localStorage.getItem(THEME_KEY); } catch (e) {}
    if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    applyTheme(t);
  })();
  document.getElementById("themeBtn").onclick = () => {
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  };

  // ---------- export / import ----------
  document.getElementById("exportBtn").onclick = () => {
    const blob = new Blob([JSON.stringify({ folders, bookmarks }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "bookmarks-backup.json";
    a.click();
    URL.revokeObjectURL(a.href);
    toast("Backup downloaded");
  };
  const importFile = document.getElementById("importFile");
  document.getElementById("importBtn").onclick = () => importFile.click();
  importFile.onchange = () => {
    const f = importFile.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        // accept v2 object { folders, bookmarks } or a bare v1 array
        const arr = Array.isArray(data) ? data : (Array.isArray(data.bookmarks) ? data.bookmarks : null);
        if (!arr) throw new Error("bad");
        const importedFolders = (!Array.isArray(data) && Array.isArray(data.folders)) ? data.folders : [];
        folders = importedFolders.map(f => ({ id: f.id || uid(), name: String(f.name || "Folder") }));
        const folderIds = new Set(folders.map(f => f.id));
        // light validation / normalization
        bookmarks = arr.map(b => ({
          id: b.id || uid(),
          title: String(b.title || ""),
          url: normalizeUrl(b.url || ""),
          visits: Number(b.visits) || 0,
          folderId: folderIds.has(b.folderId) ? b.folderId : null,
          subpages: Array.isArray(b.subpages) ? b.subpages.map(s => ({
            id: s.id || uid(), title: String(s.title || ""), url: normalizeUrl(s.url || ""), visits: Number(s.visits) || 0
          })) : []
        })).filter(b => b.url);
        activeFolder = ALL;
        save(); render(); toast("Backup imported");
      } catch (e) { toast("Couldn’t read that file"); }
      importFile.value = "";
    };
    reader.readAsText(f);
  };

  // ---------- toast ----------
  let toastTimer = null;
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1900);
  }

  // ---------- keyboard ----------
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { closeBookmarkModal(); morePop.classList.remove("show"); }
    if (e.key === "/" && document.activeElement.tagName !== "INPUT") {
      e.preventDefault(); document.getElementById("searchInput").focus();
    }
  });

  render();
})();
</script>
</body>
</html>
